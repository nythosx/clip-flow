<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <style>
      body {
        width: 240px;
        margin: 0;
        padding: 14px;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        font-size: 13px;
        background: #18181b;
        color: #e4e4e7;
      }
      h1 {
        font-size: 13px;
        font-weight: 600;
        margin: 0 0 10px;
      }
      .row {
        display: flex;
        align-items: center;
        gap: 8px;
        margin-bottom: 10px;
      }
      .dot {
        width: 9px;
        height: 9px;
        border-radius: 50%;
        background: #71717a;
        flex-shrink: 0;
      }
      .dot.connected {
        background: #22c55e;
      }
      .dot.disconnected {
        background: #ef4444;
      }
      #statusText {
        flex: 1;
      }
      button {
        width: 100%;
        padding: 7px 0;
        border: none;
        border-radius: 6px;
        background: #2563eb;
        color: white;
        font-size: 12px;
        font-weight: 500;
        cursor: pointer;
      }
      button:hover {
        background: #3b82f6;
      }
      button:disabled {
        opacity: 0.6;
        cursor: default;
      }
      p.hint {
        font-size: 11px;
        color: #a1a1aa;
        margin: 10px 0 0;
        line-height: 1.4;
      }
    </style>
  </head>
  <body>
    <h1>ClipFlow AI Engine</h1>
    <div class="row">
      <span id="dot" class="dot"></span>
      <span id="statusText">Checking…</span>
    </div>
    <button id="reconnectBtn">Refresh connection</button>
    <p class="hint" id="hint"></p>
    <script src="popup.js"></script>
  </body>
</html>
